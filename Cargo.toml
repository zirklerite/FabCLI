[package]
name = "fabcli"
version = "0.2.1"
edition = "2021"
description = "Command-line wrapper around egs-api-rs for driving Epic Games / Fab marketplace APIs from AI agents"
license = "GPL-3.0-or-later"

[[bin]]
name = "fabcli"
path = "src/main.rs"

[dependencies]
tempfile = "3"
egs-api = { path = "egs-api-rs" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "rt", "net", "io-util", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
webbrowser = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }
# Only `Extract` is used; 1.x still requires an HTTP client feature to
# compile, so it gets reqwest on rustls like the rest.
self_update = { version = "1", default-features = false, features = ["reqwest", "rustls", "archive-zip", "compression-zip-deflate", "compression-tar-gz"] }
# Swaps the running binary (`self_update` 1.x no longer re-exports it).
self-replace = "1"
semver = "1"
keyring = { version = "3", default-features = false, features = ["windows-native", "linux-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
indicatif = "0.17"
sha1 = "0.10"
sha2 = "0.10"
fs4 = "0.13"
chrono = { version = "0.4", features = ["serde"] }
wry = "0.50"

[target.'cfg(windows)'.dependencies]
# Pinned to 0.60 to match wry 0.50's internal `windows` version; lets
# us create our own bare HWND (for the hidden WebView host) while
# still handing it to wry via `raw_window_handle` without ABI drift.
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# GTK bindings for the Linux WebView host. Version choice mirrors
# what `wry 0.50`'s Linux backend binds against.
gtk = "0.18"

[profile.release]
opt-level = "z"
lto = true
strip = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
reqwest = { version = "0.13", default-features = false }
# Fixture archives for the `fabcli update` install tests.
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
